<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aira AI Assistant</title>
<style>
body{margin:0;background:#0b0d15;color:#fff;font-family:Arial,sans-serif;display:flex;justify-content:center;min-height:100vh}
main{width:min(700px,92%);padding:35px 0}
h1{color:#e8c778}p{color:#b7bdce;line-height:1.6}
#chat{margin:24px 0;display:flex;flex-direction:column;gap:12px}
.msg{padding:13px;border-radius:14px;background:#191d2b;white-space:pre-wrap;overflow-wrap:anywhere}
.user{background:#303249;align-self:flex-end;max-width:90%}
form{display:flex;gap:8px;position:sticky;bottom:12px}
input{flex:1;min-width:0;padding:14px;border-radius:12px;border:1px solid #44485b;background:#191d2b;color:white;font-size:16px}
button{padding:12px 16px;border:0;border-radius:12px;background:#e8c778;color:#17120a;font-weight:bold}
</style>
</head>
<body><main>
<h1>✦ Aira AI Assistant</h1>
<p>Your personal assistant · Hindi · Gujarati · English</p>
<div id="chat"><div class="msg">નમસ્તે! હું Aira છું. આજે હું તમને કેવી રીતે મદદ કરી શકું?</div></div>
<form id="form"><input id="message" placeholder="તમારો મેસેજ લખો..." required><button>Send</button></form>
<p>Demo version · Real AI answers require a secure AI backend.</p>
<script>
const form=document.getElementById('form');
const input=document.getElementById('message');
const chat=document.getElementById('chat');
form.addEventListener('submit',function(e){
e.preventDefault();
const text=input.value.trim();
if(!text)return;
const user=document.createElement('div');
user.className='msg user';user.textContent=text;chat.appendChild(user);
const reply=document.createElement('div');
reply.className='msg';
reply.textContent='તમારો મેસેજ મળ્યો! આ હાલમાં demo version છે. સાચા AI જવાબો માટે AI backend જોડવાનું બાકી છે.';
chat.appendChild(reply);input.value='';
});
</script>
</main></body></html>
